name: 'Clean after'
description: 'Cleans up the workspace after build finishes'
author: 'mickem'
branding:
  icon: 'delete'
  color: 'red'
inputs:
  keepGit:
    description: 'Keep the .git folder to speedup cloning'
    required: false
    default: 'false'
  paths:
    description: >-
      What to clean up: glob patterns relative to the workspace, one per line.
      Prefix a pattern with "!" to keep what it matches. Defaults to "*", which is
      everything in the workspace.
    required: false
    default: '*'
runs:
  using: 'node24'
  main: 'index.js'
  post: 'cleanup.js'
