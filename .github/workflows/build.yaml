name: Build

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - 'test/v*'

permissions:
  contents: read

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node24 is what the action declares in action.yml, node22 is kept so the
        # sources stay runnable on the previous LTS.
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test:coverage

  self-test:
    name: Self test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      # Runs the action exactly as a consumer would. Its post step cleans this workspace when
      # the job ends and fails the job if the declared runtime or the code does not work.
      - name: Clean after
        uses: ./
        with:
          keepGit: true
          # Exercises the paths input on a real runner too: node_modules is kept by the
          # exclusion, .git by keepGit, everything else in the workspace goes.
          paths: |
            *
            !node_modules
      - name: Produce something to clean up
        run: |
          mkdir -p build
          echo artifact > build/artifact.bin

  release:
    name: Release
    needs: [test, self-test]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/test/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Publish release branch and tags
        run: scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
